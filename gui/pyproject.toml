[project]
name = "polytaxo-gui"
dynamic = ["version"]
description = "Graphical user interface for PolyTaxo."
requires-python = ">=3.8"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/polytaxo_gui"]
