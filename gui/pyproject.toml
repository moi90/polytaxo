[project]
name = "polytaxo-gui"
dynamic = ["version"]
description = "Graphical user interface for PolyTaxo."
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "polytaxo>=0.3,<0.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", tag_regex = "^polytaxo-gui-v(?P<version>\\d.*)$", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "polytaxo-gui-v*"] }

[tool.hatch.build.hooks.vcs]
version-file = "src/polytaxo_gui/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polytaxo_gui"]

[tool.uv.sources]
polytaxo = { workspace = true }
