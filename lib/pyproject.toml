[project]
name = "polytaxo"
description = "A versatile hierarchical classification system designed to handle complex, polyhierarchical descriptions."
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Simon-Martin Schröder", email = "mschroeder@geomar.de" }
]
license = "GPL-3.0-only"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", tag_regex = "^polytaxo-v(?P<version>\\d.*)$", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "polytaxo-v*"] }

[tool.hatch.build.hooks.vcs]
version-file = "src/polytaxo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polytaxo"]
