[tool.uv.workspace]
members = ["lib", "gui"]

[dependency-groups]
dev = [
    "hypothesis",
    "polytaxo",
    "pytest",
    "pytest-cov",
    "pyright",
]
docs = [
    "sphinx>=1.4",
]

[tool.uv.sources]
polytaxo = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=polytaxo --cov-report xml"
