[tool.uv.workspace]
members = ["lib", "gui"]

[dependency-groups]
dev = [
    "hypothesis",
    "polytaxo",
    "polytaxo_gui",
    "pytest",
    "pytest-cov",
    "pyright",
    "selenium",
    "pytest-selenium>=4.1.0",
]
docs = [
    "sphinx>=1.4",
]

[tool.uv.sources]
polytaxo = { workspace = true }
polytaxo_gui = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=polytaxo --cov=polytaxo_gui --cov-report xml"
